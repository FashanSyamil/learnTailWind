<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>learntailwind</title>
    <link href="/src/style.css" rel="stylesheet">
</head>
<body>
    
    <div class="flex min-h-screen">
        <!-- left sidebar -->
        <div class="hidden md-block md:w-72 lg:w-96 bg-pink-100 md:bg-green-400">
            Left sidebar
        </div>
        
        <!-- Content Area -->
        <div class="flex-1 bg-pink-200 " >
            <div class="mb-4">
                <button class="bg-blue-600 p-1 md:hidden">Hamburger</button>    
            </div>
            
            Content Area
            
            <div class="bg-white rounded-md shadow-md p-4 mt-10">
                Responsive grid with Flexbox
                
                <div class="flex flex-wrap gap-8">
                    <div class="bg-blue-100 h-56 w-full md:w-1/2 lg:w-1/3 xl:w-1/4">
                        Grid 1
                    </div>
                    <div class="bg-pink-100 h-56 w-full md:w-1/2 lg:w-1/3 xl:w-1/4">
                        Grid 2
                    </div>
                    <div class="bg-yellow-100 h-56 w-full md:w-1/2 lg:w-1/3 xl:w-1/4">
                        Grid 3
                    </div>
                    <div class="bg-green-100 h-56 w-full md:w-1/2 lg:w-1/3 xl:w-1/4">
                        Grid 4
                    </div>
                </div>

                <div>
                    <div class="grid grid-cols-4 gap-4 mt-10">
                        <div class="bg-yellow-100">01</div>
                        <div class="bg-red-100">02</div>
                        <div class="bg-blue-100">03</div>
                        <div class="bg-pink-100">04</div>
                        <div class="bg-gray-100">05</div>
                        <div class="bg-purple-100">06</div>
                        <div class="bg-indigo-100">07</div>
                        <div class="bg-slate-100">08</div>
                    </div>
                </div>
                
            </div>
            
        </div>
        
        
    </div>
    
</body>
</html>
